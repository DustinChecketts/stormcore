name: Reusable addon quality checks

on:
  workflow_call:
    inputs:
      strict:
        description: Fail on formatting, static-analysis and policy findings
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out addon source
        uses: actions/checkout@v5

      - name: Check out StormCore checks
        uses: actions/checkout@v4
        with:
          repository: DustinChecketts/StormCore
          # Pilot: use the same StormCore branch as the reusable workflow.
          # Replace with a reviewed immutable commit when stabilized.
          ref: feature/addon-local-quality-config
          path: .stormcore

      - name: Install Lua 5.1 and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
            count=$((count+1))
          done < <(find . -name '*.lua' -type f -not -path './.git/*' -not -path './.stormcore/*' -print0)
          test "$count" -gt 0
          echo "Validated $count Lua files"

      - name: Metadata and package policy
        run: python3 .stormcore/scripts/validate_addon.py .

      - name: Build and inspect non-publishing ZIP preview
        run: python3 .stormcore/scripts/preview_package.py .

      - name: Upload ZIP preview for inspection
        uses: actions/upload-artifact@v4
        with:
          name: stormcore-package-preview
          path: /tmp/stormcore-package-preview.zip
          retention-days: 3

      - name: Static analysis (advisory until baseline is reviewed)
        continue-on-error: ${{ !inputs.strict }}
        run: |
          if [ -f .github/luacheckrc ]; then
            config=(--config .github/luacheckrc)
          elif [ -f .luacheckrc ]; then
            config=(--config .luacheckrc)
          else
            config=()
          fi
          find . -name '*.lua' -type f -not -path './.stormcore/*' -print0 | xargs -0 -r luacheck "${config[@]}" --codes --no-color --no-max-line-length

      - name: Install StyLua
        run: |
          cargo install stylua --version 2.1.0 --locked

      - name: Formatting check (advisory until baseline is reviewed)
        continue-on-error: ${{ !inputs.strict }}
        run: |
          if [ -f stylua.toml ]; then
            config=(--config-path stylua.toml)
          elif [ -f .stylua.toml ]; then
            config=(--config-path .stylua.toml)
          else
            config=(--syntax Lua51)
          fi
          find . -name '*.lua' -type f -not -path './.stormcore/*' -print0 | xargs -0 -r stylua --check "${config[@]}"

      - name: Strict metadata and packaging policy
        if: inputs.strict
        run: python3 .stormcore/scripts/validate_addon.py . --strict
